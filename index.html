<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>百应</title>
    <style>
      /* Pre-React splash: a static replica of EngineStartupOverlay so the whole
         startup (window shown -> renderer init -> engine starting) is one
         continuous screen. Replaced automatically when React mounts into #root.
         Keep layout/metrics in sync with EngineStartupOverlay.tsx. */
      .splash,
      .splash * {
        box-sizing: border-box;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      html.dark .splash {
        background: #1a1d27;
      }
      .splash-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(360deg, rgba(255, 0, 77, 0) 5.5%, rgba(255, 0, 77, 0.05) 100%);
      }
      .splash-content {
        position: relative;
        display: flex;
        width: 420px;
        flex-direction: column;
        align-items: center;
        padding: 0 24px;
      }
      .splash-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
      }
      .splash-logo {
        position: relative;
        display: block;
        width: 120px;
        height: 120px;
        user-select: none;
        -webkit-user-drag: none;
        transform-origin: center;
        overflow: visible;
        animation: splash-bot-appear 0.52s cubic-bezier(0.18, 0.88, 0.26, 1) both;
      }
      .splash-eyes {
        transform-origin: 0 0;
        animation: splash-eye-tour 4s cubic-bezier(0.65, 0, 0.35, 1) 0.7s infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .splash-eyes {
          animation: none;
        }
      }
      .splash-title {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 32px;
        font-weight: 700;
        color: #1a1d23;
        text-align: center;
      }
      html.dark .splash-title {
        color: #e4e5e9;
      }
      .splash-subtitle {
        margin: 0 0 32px;
        font-size: 14px;
        line-height: 20px;
        color: #6b7280;
        text-align: center;
      }
      html.dark .splash-subtitle {
        color: #8b8fa3;
      }
      .splash-bar {
        position: relative;
        width: 100%;
        height: 6px;
        border-radius: 9999px;
        background: rgba(59, 130, 246, 0.15);
        overflow: hidden;
      }
      .splash-bar-shimmer {
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, transparent, #3b82f6, transparent);
        animation: splash-shimmer 1.5s infinite;
      }
      .splash-bar-below {
        width: 100%;
        min-height: 16px;
        margin-top: 6px;
      }
      .splash-tips {
        width: 100%;
        margin-top: 40px;
        border: 1px solid rgba(224, 226, 231, 0.3);
        border-radius: 12px;
        background: rgba(240, 241, 244, 0.6);
        padding: 12px 16px;
      }
      html.dark .splash-tips {
        border-color: rgba(42, 46, 56, 0.3);
        background: rgba(36, 40, 48, 0.6);
      }
      .splash-tips-label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
        color: #3b82f6;
      }
      .splash-tips-label svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .splash-tip-text {
        margin: 0;
        min-height: 40px;
        font-size: 14px;
        line-height: 1.625;
        color: #6b7280;
      }
      html.dark .splash-tip-text {
        color: #8b8fa3;
      }
      .splash-tip-dots {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 8px;
      }
      .splash-dot {
        position: relative;
        width: 4px;
        height: 4px;
        border-radius: 9999px;
        background: rgba(59, 130, 246, 0.25);
        border: 0;
        padding: 0;
        margin: 0;
        cursor: pointer;
        transition: all 0.3s;
        -webkit-appearance: none;
        appearance: none;
      }
      /* enlarged hit area, same as the React overlay's after:-inset-* */
      .splash-dot::after {
        content: '';
        position: absolute;
        top: -6px;
        bottom: -6px;
        left: -2px;
        right: -2px;
      }
      .splash-dot:hover {
        background: rgba(59, 130, 246, 0.5);
      }
      .splash-dot-active,
      .splash-dot-active:hover {
        width: 12px;
        background: #3b82f6;
      }
      @keyframes splash-bot-appear {
        0% {
          opacity: 0;
          transform: scale(0.9);
        }
        72% {
          opacity: 1;
          transform: scale(1.04);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      /*
        Eye-orbit stand-in for the React tour: eyes slide off the silhouette
        (limb), hide behind, reappear, then rest. Cycle ≈ tour + gap.
      */
      @keyframes splash-eye-tour {
        0%,
        8% {
          transform: translate(0px, 0px);
          opacity: 1;
        }
        22% {
          transform: translate(108px, 13px);
          opacity: 1;
        }
        30%,
        42% {
          transform: translate(0px, 26px);
          opacity: 0;
        }
        50% {
          transform: translate(-108px, 13px);
          opacity: 0;
        }
        58% {
          transform: translate(-108px, 13px);
          opacity: 1;
        }
        72% {
          transform: translate(0px, 0px);
          opacity: 1;
        }
        76% {
          transform: translate(0px, 0px) scaleY(0.08);
          opacity: 1;
        }
        82%,
        100% {
          transform: translate(0px, 0px) scaleY(1);
          opacity: 1;
        }
      }
      @keyframes splash-shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
    </style>
    <script>
      // 在页面加载前预设主题，避免闪烁。
      // 'lobster-theme-appearance' 由 theme-manager.ts 在每次应用主题时写入。
      (function () {
        try {
          var appearance = localStorage.getItem('lobster-theme-appearance');
          if (appearance !== 'dark' && appearance !== 'light') {
            appearance = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.add(appearance);
          document.documentElement.style.backgroundColor = appearance === 'dark' ? '#0F1117' : '#F8F9FB';
        } catch (e) {
          console.error('Error applying theme early:', e);
        }
      })();
    </script>

    <script>
      // Bloub-style colorful orbit ribbons around the splash mascot.
      // Keep in sync with src/renderer/components/cowork/coworkStartupOrbitRings.ts
      (function () {
        try {
          var svg = document.getElementById('splash-logo');
          var backG = document.getElementById('splash-orbit-back');
          var frontG = document.getElementById('splash-orbit-front');
          if (!svg || !backG || !frontG) return;

          var TAU = Math.PI * 2;
          var BALL = 100;
          var reduce = false;
          try {
            reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          } catch (e) { /* ignore */ }

          function r2(v) { return Math.round(v * 100) / 100; }
          function createRng(seed) {
            var a = seed >>> 0;
            return function () {
              a = (a + 0x6d2b79f5) >>> 0;
              var t = Math.imul(a ^ (a >>> 15), 1 | a);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          function wheel(hue, s, l) {
            s = s == null ? 0.55 : s;
            l = l == null ? 0.62 : l;
            var h = ((hue % 360) + 360) % 360;
            var c = (1 - Math.abs(2 * l - 1)) * s;
            var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
            var m = l - c / 2;
            var rgb =
              h < 60 ? [c, x, 0] :
              h < 120 ? [x, c, 0] :
              h < 180 ? [0, c, x] :
              h < 240 ? [0, x, c] :
              h < 300 ? [x, 0, c] : [c, 0, x];
            function hex(v) {
              return Math.round((v + m) * 255).toString(16).padStart(2, '0');
            }
            return '#' + hex(rgb[0]) + hex(rgb[1]) + hex(rgb[2]);
          }

          var RING_RNG = createRng(0xa11ce);
          var RINGS = [];
          for (var i = 0; i < 6; i++) {
            RINGS.push({
              a: 1.3 + RING_RNG() * 0.1,
              k: 0.05 + RING_RNG() * 0.4,
              tilt: (i / 6) * Math.PI + RING_RNG() * 0.5,
              speed: 3 + RING_RNG() * 0.7,
              phase: RING_RNG() * TAU,
              sweep: 0.6 + RING_RNG() * 0.25,
              hue: (i * 360) / 6 + RING_RNG() * 30,
              hueSpan: 60 + RING_RNG() * 60,
              width: 0.05 + RING_RNG() * 0.012,
              cx: 0,
              cy: 0.1
            });
          }

          function arcRender(seed, t, scale, id, opacity) {
            var spin = seed.phase + t * seed.speed * TAU;
            var cu = Math.cos(seed.tilt);
            var su = Math.sin(seed.tilt);
            var kz = Math.sqrt(Math.max(0, 1 - seed.k * seed.k));
            var N = 64;
            var span = seed.sweep * TAU;
            var front = '';
            var back = '';
            var prev = null;
            for (var j = 0; j <= N; j++) {
              var th = spin + (j / N) * span;
              var ct = Math.cos(th);
              var st = Math.sin(th);
              var x = seed.a * (ct * cu + st * -su * seed.k) + seed.cx;
              var y = seed.a * (ct * su + st * cu * seed.k) + seed.cy;
              var z = seed.a * st * kz;
              var behind = z < 0;
              var sx = r2(x * scale);
              var sy = r2(y * scale);
              var cmd = behind !== prev ? 'M' : 'L';
              if (behind) back += cmd + sx + ' ' + sy;
              else front += cmd + sx + ' ' + sy;
              prev = behind;
            }
            var gx = Math.cos(seed.tilt) * seed.a * scale;
            var gy = Math.sin(seed.tilt) * seed.a * scale;
            return {
              id: id,
              front: front,
              back: back,
              width: seed.width * scale,
              opacity: opacity,
              grad: {
                x1: r2(seed.cx * scale - gx),
                y1: r2(seed.cy * scale - gy),
                x2: r2(seed.cx * scale + gx),
                y2: r2(seed.cy * scale + gy),
                stops: [
                  wheel(seed.hue),
                  wheel(seed.hue + seed.hueSpan * 0.5),
                  wheel(seed.hue + seed.hueSpan)
                ]
              }
            };
          }

          var defs = svg.querySelector('defs');
          var paths = [];
          for (var r = 0; r < RINGS.length; r++) {
            var id = 'splash-rg' + r;
            var grad = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
            grad.setAttribute('id', id);
            grad.setAttribute('gradientUnits', 'userSpaceOnUse');
            for (var s = 0; s < 3; s++) {
              var stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
              stop.setAttribute('offset', String(s / 2));
              grad.appendChild(stop);
            }
            defs.appendChild(grad);

            var backPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            backPath.setAttribute('stroke', 'url(#' + id + ')');
            backG.appendChild(backPath);
            var frontPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            frontPath.setAttribute('stroke', 'url(#' + id + ')');
            frontG.appendChild(frontPath);
            paths.push({ grad: grad, back: backPath, front: frontPath });
          }

          function paint(tSec) {
            for (var i = 0; i < RINGS.length; i++) {
              var enter = Math.max(0, Math.min(1, (tSec - i * 0.13) / 0.3));
              var arc = arcRender(RINGS[i], tSec, BALL, 'rg' + i, enter);
              var slot = paths[i];
              slot.grad.setAttribute('x1', String(arc.grad.x1));
              slot.grad.setAttribute('y1', String(arc.grad.y1));
              slot.grad.setAttribute('x2', String(arc.grad.x2));
              slot.grad.setAttribute('y2', String(arc.grad.y2));
              var stops = slot.grad.querySelectorAll('stop');
              for (var k = 0; k < stops.length; k++) {
                stops[k].setAttribute('stop-color', arc.grad.stops[k]);
              }
              slot.back.setAttribute('d', arc.back || '');
              slot.back.setAttribute('stroke-width', String(arc.width));
              slot.back.setAttribute('opacity', String(arc.opacity));
              slot.front.setAttribute('d', arc.front || '');
              slot.front.setAttribute('stroke-width', String(arc.width));
              slot.front.setAttribute('opacity', String(arc.opacity));
            }
          }

          if (reduce) {
            // Still spin, but slower — ribbons are the loading indicator.
            var slowStarted = performance.now();
            function slowTick(now) {
              paint(((now - slowStarted) / 1000) * 0.4 + 1.2);
              requestAnimationFrame(slowTick);
            }
            requestAnimationFrame(slowTick);
            return;
          }

          var started = performance.now();
          function tick(now) {
            paint((now - started) / 1000 + 1.2);
            requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        } catch (e) {
          /* keep face-only splash */
        }
      })();
    </script>
    <script>
      // 本地化启动屏文案并随机选一条小提示。
      // 'lobster-language' 由 i18n.ts 在语言确定后写入；首次启动回退到系统语言。
      // 文案需与 src/renderer/services/i18n.ts 中的 engineStarting* / loading 保持同步。
      (function () {
        try {
          var lang = localStorage.getItem('lobster-language');
          if (lang !== 'zh' && lang !== 'en') {
            lang = navigator.language === 'zh-CN' ? 'zh' : 'en';
          }
          var texts = {
            zh: {
              title: 'AI 引擎启动中',
              subtitle: '加载中...',
              label: '小提示',
              tips: [
                '让 AI 生成 HTML、SVG 或 Mermaid 图表，右侧面板会实时预览效果',
                '在「技能」中开启 Word、Excel、PPT 技能，AI 可以直接为你生成办公文档',
                '用「定时任务」让 AI 在固定时间自动执行例行工作',
                '接入微信、飞书、钉钉等聊天工具，在 IM 里随时召唤 AI',
                '对 AI 说"记住……"，重要信息会写入长期记忆，下次对话自动生效',
                'AI 执行敏感操作前会先请求你的确认，可以放心交给它'
              ]
            },
            en: {
              title: 'Starting AI engine',
              subtitle: 'Loading...',
              label: 'Tip',
              tips: [
                'Ask AI for HTML, SVG, or Mermaid diagrams — the side panel previews them live',
                'Enable Word, Excel, and PPT skills in Skills, and AI can generate office documents for you',
                'Use Scheduled Tasks to have AI run routine work automatically at fixed times',
                'Connect WeChat, Feishu, DingTalk and more to summon AI right from your IM apps',
                'Tell AI to "remember..." and it saves key facts to long-term memory for future chats',
                'AI asks for your approval before sensitive operations, so you stay in control'
              ]
            }
          };
          var t = texts[lang];
          document.getElementById('splash-title').textContent = t.title;
          document.getElementById('splash-subtitle').textContent = t.subtitle;
          document.getElementById('splash-tips-label').textContent = t.label;

          var tipText = document.getElementById('splash-tip-text');
          var dots = document.getElementById('splash-tip-dots');
          var dotButtons = [];

          // React 侧的 EngineStartupOverlay 会读取该值，从同一条小提示继续轮播
          function selectTip(idx) {
            tipText.textContent = t.tips[idx];
            for (var j = 0; j < dotButtons.length; j++) {
              dotButtons[j].className = j === idx ? 'splash-dot splash-dot-active' : 'splash-dot';
            }
            try {
              sessionStorage.setItem('lobster-splash-tip-index', String(idx));
            } catch (e) {
              /* storage unavailable */
            }
          }

          for (var i = 0; i < t.tips.length; i++) {
            var dot = document.createElement('button');
            dot.type = 'button';
            dot.className = 'splash-dot';
            dot.setAttribute('aria-label', t.label + ' ' + (i + 1));
            dot.addEventListener('click', selectTip.bind(null, i));
            dots.appendChild(dot);
            dotButtons.push(dot);
          }

          // 固定从第一条开始，保证每次启动的阅读顺序一致
          selectTip(0);
        } catch (e) {
          /* keep default zh texts */
        }
      })();
    </script>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
